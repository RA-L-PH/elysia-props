services:
  # ──────────────────────────────────────────────────────────
  # Backend API Service (Express Server on Render)
  # ──────────────────────────────────────────────────────────
  - type: web
    name: pulsestage-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build --workspace=@elysia/shared && npm run build --workspace=@elysia/api
    startCommand: npm run start --workspace=@elysia/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
